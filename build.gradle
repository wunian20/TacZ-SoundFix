plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "TacZ SoundFix"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    // 游戏内设置界面：Cloth Config（NeoForge 1.21.1 版）。
    // 玩家运行时装 cloth-config 才有设置界面；不装时 mod 照常工作（开关保持默认值）。
    implementation("me.shedaniel.cloth:cloth-config-neoforge:15.0.140")}

tasks.named('jar', Jar).configure {
    // 文件名规范：TacZ SoundFix{游戏版本}-{加载器平台}-{版本号}.jar
    archiveFileName = "TacZ SoundFix${minecraft_version}-NeoForge-${mod_version}.jar"
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
